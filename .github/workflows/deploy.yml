name: Deploy to GitHub Pages

# 이 저장소에는 빌드할 것이 없다. HTML 6개가 이미 완성본이다.
# _build/ 는 그 파일들을 만드는 재료라 웹에 올리지 않는다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 인라인 방식이라 번들러가 필요 없다.
      # 웹에 올릴 것만 _site/ 로 모은다 — _build/ · docs/ · 배치 스크립트는 뺀다.
      - name: 게시할 파일만 모은다
        run: |
          mkdir -p _site
          cp *.html _site/
          ls -la _site/

      # 빌드 결과가 저장소의 커밋본과 같은지 확인한다.
      # _build/ 만 고치고 다시 만들지 않은 채 올리면 여기서 걸린다.
      - name: 커밋된 HTML 이 _build/ 와 일치하는지 확인
        run: |
          node _build/build.mjs
          if ! git diff --quiet -- '*.html'; then
            echo "::error::커밋된 HTML 이 _build/ 의 원본과 다릅니다."
            echo "로컬에서 'node _build/build.mjs' 를 돌리고 결과를 함께 커밋하세요."
            git diff --stat -- '*.html'
            exit 1
          fi
          echo "일치합니다."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
